<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign In / Sign Up — EmotiVision</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 20% 20%,rgba(194,55,150,.18),transparent 30%),
      radial-gradient(circle at 85% 80%,rgba(240,99,105,.18),transparent 30%),
      #fffaf7;
}
.auth-card{
    width:min(450px,92vw);
    background:#fff;
    border:1px solid #eee;
    border-radius:28px;
    padding:38px;
    box-shadow:0 25px 80px rgba(20,30,45,.13);
}
.logo{
    text-align:center;
    font-size:28px;
    font-weight:800;
    color:#172033;
}
.logo span{
    color:#d23b91;
}
.subtitle{
    text-align:center;
    color:#777;
    margin:10px 0 28px;
}
.tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    background:#f5f3f4;
    padding:5px;
    border-radius:14px;
    margin-bottom:25px;
}
.tabs button{
    border:0;
    background:transparent;
    padding:12px;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
}
.tabs button.active{
    background:#fff;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}
.form{
    display:none;
}
.form.active{
    display:block;
}
label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin:15px 0 7px;
    color:#343b4b;
}
input{
    width:100%;
    height:48px;
    border:1px solid #ddd;
    border-radius:12px;
    padding:0 14px;
    font-size:15px;
    outline:none;
}
input:focus{
    border-color:#c13c96;
}
.submit{
    width:100%;
    height:50px;
    margin-top:22px;
    border:0;
    border-radius:13px;
    color:#fff;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    background:linear-gradient(100deg,#9636df,#ef626b);
}
.message{
    display:none;
    margin-top:15px;
    padding:11px;
    border-radius:11px;
    font-size:13px;
}
.message.show{display:block}
.back{
    display:block;
    text-align:center;
    margin-top:22px;
    color:#777;
    font-size:14px;
}
</style>
</head>
<body>
<div class="auth-card animated-border">
<div class="logo">Emoti<span>Vision</span></div>
<div class="subtitle">AI Emotion Detection Platform</div>

<div class="tabs">
<button id="loginTab" onclick="showForm('login')" class="active">Sign In</button>
<button id="signupTab" onclick="showForm('signup')">Create Account</button>
</div>

<form id="loginForm" class="form active" onsubmit="login(event)">
<label>Email</label>
<input id="loginEmail" type="email" required placeholder="you@example.com">
<label>Password</label>
<input id="loginPassword" type="password" required placeholder="Your password">
<button class="submit">Sign In</button>
</form>

<form id="signupForm" class="form" onsubmit="signup(event)">
<label>Full Name</label>
<input id="signupName" required placeholder="Your name">
<label>Email</label>
<input id="signupEmail" type="email" required placeholder="you@example.com">
<label>Password</label>
<input id="signupPassword" type="password" minlength="6" required placeholder="Minimum 6 characters">
<button class="submit">Create Account</button>
</form>

<div id="message" class="message"></div>
<a class="back" href="/">← Back to EmotiVision</a>
</div>

<script>
function showForm(type){
    const login = type === "login";

    document.getElementById("loginForm").classList.toggle("active",login);
    document.getElementById("signupForm").classList.toggle("active",!login);

    document.getElementById("loginTab").classList.toggle("active",login);
    document.getElementById("signupTab").classList.toggle("active",!login);

    document.getElementById("message").classList.remove("show");
}

function message(text,good){
    const box=document.getElementById("message");
    box.textContent=text;
    box.style.background=good ? "#eaf8ef" : "#fff1f2";
    box.style.color=good ? "#19713b" : "#b4233d";
    box.classList.add("show");
}

async function login(event){
    event.preventDefault();

    const response=await fetch("/api/login",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            email:document.getElementById("loginEmail").value,
            password:document.getElementById("loginPassword").value
        })
    });

    const data=await response.json();

    if(data.success){
        message("Welcome, "+data.name+"! Login successful.",true);
        setTimeout(function(){window.location.href="/";},700);
    }else{
        message(data.error || "Login failed.",false);
    }
}

async function signup(event){
    event.preventDefault();

    const response=await fetch("/api/signup",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            name:document.getElementById("signupName").value,
            email:document.getElementById("signupEmail").value,
            password:document.getElementById("signupPassword").value
        })
    });

    const data=await response.json();

    if(data.success){
        message("Account created! Welcome, "+data.name+".",true);
        setTimeout(function(){window.location.href="/";},700);
    }else{
        message(data.error || "Signup failed.",false);
    }
}

const params=new URLSearchParams(window.location.search);

if(params.get("mode")==="signup"){
    showForm("signup");
}
</script>
</body>
</html>
